# Debian Live Build Configuration for REX OS 0.1.0
# =================================================
# Updated for Debian Bookworm stability and GitHub Actions compatibility.

LB_PROJECT="rex-os"
LB_VERSION="0.1.0"
LB_ARCHITECTURE="amd64"
LB_BINARY_IMAGES="iso-hybrid"
LB_DISTRIBUTION="bookworm"
LB_BASETPM="/var/lib/live/build"

# Bootstraps and package sources (explicit Debian mirrors)
LB_BOOTSTRAP="debootstrap"
LB_BOOTSTRAP_DISTRIBUTION="bookworm"
LB_BOOTSTRAP_ARCHITECTURE="amd64"
LB_DEBIAN_INSTALLER="false"
LB_BOOTAPPEND_LIVE="boot=live components quiet splash"
LB_BOOTAPPEND_INSTALL="boot=live components quiet splash"
LB_COMPONENTS="main contrib non-free non-free-firmware"
LB_ARCHIVE_AREAS="main contrib non-free non-free-firmware"

# Use clean Debian mirrors rather than flaky fallback logic.
LB_BOOTSTRAP_APT="http://deb.debian.org/debian/"
LB_BOOTSTRAP_MIRROR="https://deb.debian.org/debian/"
LB_MIRROR_BOOTSTRAP="https://deb.debian.org/debian/"
LB_MIRROR_CHROOT="https://deb.debian.org/debian/"
LB_MIRROR_DEBIAN_INSTALLER="https://deb.debian.org/debian/"
LB_MIRROR_SECURITY="https://deb.debian.org/debian-security/"

# Package source configuration
LB_SOURCE="false"

# Python runtime stack: keep to packages known to exist in Debian Bookworm.
# Avoid speculative package names that break live-build dependency resolution.
LB_BINARY_INCLUDE="
  python3
  python3-pip
  python3-venv
  python3-aiohttp
  python3-yaml
  python3-bs4
  python3-requests
  python3-lxml
  python3-feedparser
  python3-emoji
  python3-pil
  python3-numpy
  python3-websockets
  python3-fastapi
  python3-psutil
  python3-sqlalchemy
  git
  curl
  wget
  rsync
  unzip
  zip
  p7zip-full
  sqlite3
  network-manager
  pulseaudio
  blueman
  fonts-liberation
  fonts-noto-core
  fonts-indic
  fonts-taml
  gnome-terminal
  dbus-x11
  xorg
  xserver-xorg-video-all
  xserver-xorg-input-all
  xdg-utils
  locales
  sudo
  openssh-client
"

# Live user configuration
LB_LIVE_USER="rex"
LB_LIVE_USER_PASSWORD="rex"
LB_LIVE_USER_GROUP="rex"
LB_LIVE_USER_HOME="/home/rex"

# Filesystem
LB_FILESYSTEM="ext4"

# Cleanup
LB_CLEAN="true"

# Binary package installation
LB_BINARY_PACKAGES="true"

# Keep the minimal number of extra packages so the build remains reproducible
# in GitHub Actions and does not fail during package resolution.
