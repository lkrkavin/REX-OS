# Debian Live Build Configuration for REX OS 0.1.0
# ==================================================
# Updated for Debian Bookworm compatibility and reliable package fetching

# Project metadata
LB_PROJECT="rex-os"
LB_PROJECT_VERSION="0.1.0"
LB_ARCHITECTURE="amd64"
LB_BINARY_IMAGES="iso-hybrid"

# Distribution
LB_DISTRIBUTION="bookworm"
LB_BASETEMPLATE="/var/lib/live/build"

# Bootstrap Mirror Configuration (HTTP(S) for reliability)
# NOTE: live-build constructs URLs as: ${LB_BOOTSTRAP_PROTOCOL}://${LB_BOOTSTRAP_HOST}/${LB_MIRROR_*}
# Using explicit Debian mirrors prevents flaky fallback to ftp.debian.org
LB_BOOTSTRAP_HOST="deb.debian.org"
LB_BOOTSTRAP_PROTOCOL="https"
LB_MIRROR_BOOTSTRAP="https://deb.debian.org/debian/"
LB_MIRROR_CHROOT="https://deb.debian.org/debian/"
LB_MIRROR_BINARY="https://deb.debian.org/debian/"
LB_MIRROR_DEBIAN_INSTALLER="https://deb.debian.org/debian/"
LB_MIRROR_SECURITY="https://deb.debian.org/debian-security/"

# Repository configuration
LB_SOURCE="false"

# APT Configuration
# Use bootstrap-prefixed variables for early apt setup during bootstrapping
LB_BOOTSTRAP_APT_RECOMMENDS="false"
LB_BOOTSTRAP_APT_SUGGESTS="false"
LB_COMPONENTS="main contrib non-free"
LB_ARCHIVE_AREAS="main contrib non-free"

# Kernel
LB_KERNEL_FLAVOURS="amd64"
LB_KERNEL_IMAGE="linux-image-amd64"

# ISO configuration
LB_ISO_APPNAME="REX OS"
LB_ISO_PRESEED="true"
LB_ISO_VOLUME="REX-OS-0.1.0"
LB_ISO_PUBLISHER="grub"

# Boot configuration
LB_BOOTAPPEND_LIVE="boot=live components quiet splash"
LB_BOOTAPPEND_INSTALL="boot=live components quiet splash"

# Desktop
LB_INCLUDE_MOST_PACKAGES="true"
LB_DESKTOP="plasma"
LB_STANDARD_PACKAGES="kde-plasma-desktop"

# Additional packages
# NOTE: python3-yaml replaces python3-pyyaml
# NOTE: python3-bs4 replaces python3-beautifulsoup4
# NOTE: python3-opencv (not python3-cv2)
# NOTE: python3-pyqt6.qtwebengine (not python3-pyqt6-qtwebengine)

# Python 3 standard library (no package needed):
# - sqlite3
# - os, sys, asyncio, json, etc.

# Python packages available in Debian Bookworm
LB_BINARY_INCLUDE="
  python3
  python3-pip
  python3-pyqt5
  python3-websockets
  python3-opencv
  python3-numpy
  python3-fastapi
  python3-aiohttp
  python3-yaml
  python3-pil
  python3-requests
  python3-lxml
  python3-feedparser
  python3-emoji
  python3-bs4
  python3-pyqt6
  python3-pyqt6.qtwebengine
  python3-qrcode
  ffmpeg
  sox
  espeak-ng
  libespeak-ng1
  pulseaudio
  network-manager
  network-manager-gnome
  bluez
  bluez-tools
  pulseaudio-module-bluetooth
  cryptsetup
  cryptsetup-initramfs
  apparmor
  apparmor-profiles
  ufw
  netfilter-persistent
  fail2ban
  flatpak
  synaptic
  vim
  nano
  htop
  tree
  git
  curl
  wget
  rsync
  unzip
  zip
  p7zip-full
  bleachbit
  timeshift
  kdeconnect
  libreoffice
  fonts-liberation
  fonts-noto-core
  fonts-indic
  fonts-taml
  kde-standard
"

# Live user configuration
LB_LIVE_USER="rex"
LB_LIVE_USER_PASSWORD="rex"
LB_LIVE_USER_GROUP="rex"

# Filesystem
LB_FILESYSTEM="ext4"

# Cleanup
LB_CLEANUP="true"

# Binary packages
LB_BINARY_PACKAGES="true"

# Source packages
LB_SOURCE_PACKAGES="false"
