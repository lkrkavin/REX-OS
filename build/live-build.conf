# Live user configuration
LB_LIVE_USER="rex"
LB_LIVE_USER_PASSWORD="rex"
LB_LIVE_USER_GROUP="rex"

# Filesystem
LB_FILESYSTEM="ext4"

# Cleanup
LB_CLEANUP="true"

# Binary packages
LB_BINARY_PACKAGES="true"

# Source packages
LB_SOURCE_PACKAGES="false"