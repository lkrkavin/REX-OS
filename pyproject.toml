[project]
name = "rex-os"
version = "0.1.0"
description = "REX OS - Modular AI-powered operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "feedparser>=6.0.0",
    "emoji>=2.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
    "fastapi>=0.100.0",
    "psutil>=5.9.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
voice = [
    "vosk>=0.3.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
]
screen = [
    "mss>=9.0.0",
    "opencv-python>=4.8.0",
]
remote = [
    "pyautogui>=0.9.54",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not use sys.path.insert
]
exclude = [
    "build/",
    ".git/",
    "__pycache__/",
    "*.egg-info/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true