name: Build REX OS ISO

concurrency:
  group: rex-os-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master", "fix/iso-build", "feat/rex144-secure-device-foundation" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python syntax and Google Search tests
        run: |
          python3 -m compileall -q ais ui services connect omni build/config/includes.chroot/opt/rex-os/ais build/config/includes.chroot/opt/rex-os/ui build/config/includes.chroot/opt/rex-os/services build/config/includes.chroot/opt/rex-os/connect build/config/includes.chroot/opt/rex-os/omni
          python3 -m unittest discover -s tests -p 'test_rex_desktop_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_build57_foundation.py' -v
          python3 -m unittest discover -s tests -p 'test_web_search.py' -v
          python3 -m unittest discover -s tests -p 'test_wake_word.py' -v
          python3 -m unittest discover -s tests -p 'test_openrouter_platforms.py' -v
          python3 -m unittest discover -s tests -p 'test_rex_automation_sync.py' -v
          python3 -m unittest discover -s tests -p 'test_mac_remote.py' -v
          python3 -m unittest discover -s tests -p 'test_device_registry_security.py' -v
          python3 -m unittest discover -s tests -p 'test_pairing_security.py' -v

      - name: Free disk space on runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ails
          df -h

      - name: Run REX OS Build
        run: |
          mkdir -p build/output
          docker run --rm --privileged -e DEBIAN_FRONTEND=noninteractive -v "$GITHUB_WORKSPACE/build:/build" debian:bookworm bash -c "apt-get update && apt-get install -y live-build debootstrap xorriso squashfs-tools rsync wget curl ca-certificates git grub-efi-amd64-bin grub-pc-bin mtools dosfstools isolinux syslinux-common python3 python3-yaml debian-archive-keyring && lb --version && cd /build && chmod +x build-rex-os.sh && ./build-rex-os.sh"

      - name: Restore output ownership
        if: always()
        run: if [ -d build/output ]; then sudo chown -R "$USER:$USER" build/output; fi

      - name: Generate Checksums and Manifest
        run: |
          cd build/output
          if [ -f REX-OS-0.1.0-amd64.iso ]; then
            sha256sum REX-OS-0.1.0-amd64.iso > REX-OS-0.1.0-amd64.iso.sha256
            sha512sum REX-OS-0.1.0-amd64.iso > REX-OS-0.1.0-amd64.iso.sha512
            file REX-OS-0.1.0-amd64.iso
            ls -lh REX-OS-0.1.0-amd64.iso
          else
            echo "Error: ISO file not found in output directory!"
            exit 1
          fi

      - name: Upload REX OS ISO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: REX-OS-0.1.0-amd64
          path: |
            build/output/REX-OS-0.1.0-amd64.iso
            build/output/REX-OS-0.1.0-amd64.iso.sha256
            build/output/REX-OS-0.1.0-amd64.iso.sha512
            build/output/MANIFEST.txt
          retention-days: 7
