name: Build REX OS ISO

on:
  push:
    branches: [ "main", "master", "fix/iso-build" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container: debian:bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "Freeing disk space..."
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf /usr/local/lib/android
          rm -rf /opt/ails
          df -h

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            live-boot \
            live-config \
            git \
            squashfs-tools \
            xorriso \
            rsync \
            wget \
            curl \
            ca-certificates \
            grub-efi-amd64 \
            mtools \
            python3 \
            python3-pip \
            python3-aiohttp \
            python3-yaml \
            python3-bs4 \
            debian-archive-keyring

      - name: Prepare build environment
        run: |
          mkdir -p build/output
          chmod +x build/build-rex-os.sh

      - name: Run REX OS Build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ -L /build ]; then
              if [ "$(readlink -f /build)" != "$(readlink -f "$GITHUB_WORKSPACE/build")" ]; then
                  echo "ERROR: /build points to an unexpected location"
                  exit 1
              fi
          elif [ -e /build ]; then
              echo "ERROR: /build already exists and is not a symlink"
              exit 1
          else
              ln -s "$GITHUB_WORKSPACE/build" /build
          fi

          cd "$GITHUB_WORKSPACE/build"
          ./build-rex-os.sh

      - name: Generate Checksums and Manifest
        run: |
          cd build/output
          if [ -f REX-OS-0.1.0-amd64.iso ]; then
            sha256sum REX-OS-0.1.0-amd64.iso > REX-OS-0.1.0-amd64.iso.sha256
            sha512sum REX-OS-0.1.0-amd64.iso > REX-OS-0.1.0-amd64.iso.sha512
            file REX-OS-0.1.0-amd64.iso
            ls -lh REX-OS-0.1.0-amd64.iso
          else
            echo "Error: ISO file not found in output directory!"
            exit 1
          fi

      - name: Upload REX OS ISO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: REX-OS-0.1.0-amd64
          path: |
            build/output/REX-OS-0.1.0-amd64.iso
            build/output/REX-OS-0.1.0-amd64.iso.sha256
            build/output/REX-OS-0.1.0-amd64.iso.sha512
            build/output/MANIFEST.txt
          retention-days: 7
