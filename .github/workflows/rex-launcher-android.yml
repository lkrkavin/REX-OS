name: REX Launcher Android CI

on:
  push:
    branches:
      - feat/rex-launcher-android9
    paths:
      - "rex-launcher/**"
      - ".github/workflows/rex-launcher-android.yml"
  pull_request:
    paths:
      - "rex-launcher/**"
      - ".github/workflows/rex-launcher-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android 9+ debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: rex-launcher
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rex-launcher-debug-apk
          path: rex-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
